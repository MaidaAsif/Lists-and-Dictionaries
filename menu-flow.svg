<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="t d">
  <title id="t">How the program works</title>
  <desc id="d">User input is validated, handled by core functions, and stored in the products and sales lists. The menu repeats until Exit.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect width="960" height="360" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="480" y="48" font-size="22" font-weight="700" fill="#0f172a">How the program works</text>

    <g fill="#ffffff" stroke="#0f766e" stroke-width="2">
      <rect x="40" y="90" width="190" height="120" rx="12"/>
      <rect x="270" y="90" width="190" height="120" rx="12"/>
      <rect x="500" y="90" width="190" height="120" rx="12"/>
      <rect x="730" y="90" width="190" height="120" rx="12"/>
    </g>

    <g font-size="19" font-weight="700" fill="#0f766e">
      <text x="135" y="132">1. User input</text>
      <text x="365" y="132">2. Validation</text>
      <text x="595" y="132">3. Core functions</text>
      <text x="825" y="132">4. Data stores</text>
    </g>

    <g font-size="14" fill="#475569">
      <text x="135" y="162">Menu choice, ID,</text>
      <text x="135" y="182">price, quantity</text>
      <text x="365" y="162">get_number()</text>
      <text x="365" y="182">get_text(), try/except</text>
      <text x="595" y="162">add, search, update,</text>
      <text x="595" y="182">sale, report</text>
      <text x="825" y="162">products and sales</text>
      <text x="825" y="182">(lists of dictionaries)</text>
    </g>

    <g stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
      <line x1="230" y1="150" x2="268" y2="150"/>
      <line x1="460" y1="150" x2="498" y2="150"/>
      <line x1="690" y1="150" x2="728" y2="150"/>
    </g>

    <path d="M825 212 V282 H135 V214" stroke="#0f766e" stroke-width="2.5" stroke-dasharray="7 6" fill="none" marker-end="url(#arrow)"/>
    <text x="480" y="312" font-size="15" font-weight="600" fill="#0f172a">The menu repeats until the user chooses 8 (Exit)</text>
  </g>
</svg>